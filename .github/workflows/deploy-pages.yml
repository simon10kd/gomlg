name: Deploy Web Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot Headless 4.2.2
        run: |
          mkdir -p godot
          wget -q https://downloads.tuxfamily.org/godotengine/4.2.2/mono/Godot_v4.2.2-stable_linux_headless.64.zip -O godot/headless.zip || \
            wget -q https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_linux_headless.64.zip -O godot/headless.zip
          unzip -q godot/headless.zip -d godot
          mv godot/Godot_v4.2.2-stable_linux_headless.64 godot/godot-headless
          chmod +x godot/godot-headless

      - name: Install export templates
        run: |
          wget -q https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_export_templates.zip -O templates.zip
          unzip -q templates.zip -d templates
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          cp -r templates/templates/. ~/.local/share/godot/export_templates/4.2.2.stable

      - name: Export Web build
        run: |
          ./godot/godot-headless --headless --path . --export-release "Web"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4


